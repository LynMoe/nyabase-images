name: sync-pinned-images

on:
  push:
    paths:
      - "images/**"
      - "scripts/sync.py"
      - ".github/workflows/sync.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-upload even if this catalog version is already on the release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-stable-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish pinned catalog versions
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: stable
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python3 scripts/sync.py
