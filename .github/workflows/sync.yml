name: sync-pinned-images

on:
  push:
    paths:
      - "images/**"
      - "scripts/sync.py"
      - "scripts/bake.py"
      - "scripts/verify_rootfs.py"
      - "recipes/**"
      - ".github/workflows/sync.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Retry upload of identical combined-hash blobs only"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-stable-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bake tools
        run: sudo apt-get update -qq && sudo apt-get install -y squashfs-tools xz-utils systemd
      - name: Bake and publish Nyabase workload images
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: stable
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: sudo --preserve-env=GH_TOKEN,GITHUB_REPOSITORY,RELEASE_TAG,FORCE python3 scripts/sync.py
